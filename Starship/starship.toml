# ===========================
# Starship Configuration
# ===========================

scan_timeout = 100
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$golang\
$rust\
$cmd_duration\
$character
"""

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "🌿 "
style = "bold purple"

[git_status]
style = "bold red"

[python]
symbol = "🐍 "

[nodejs]
symbol = "⬢ "

[golang]
symbol = "🐹 "

[rust]
symbol = "🦀 "

[cmd_duration]
min_time = 1000
format = "⏱ [$duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"